<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf6ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ほんのしおり">
  <title>ほんのしおり</title>
  <link rel="manifest" href="manifest.json" id="manifestLink">
  <script>
    // 試験版（パスに -beta を含む／ローカル）は別アプリとして見せる。判定は config.js と同じ
    if (/-beta(\/|$)/.test(location.pathname) || ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname)) {
      document.getElementById('manifestLink').href = 'manifest-beta.json';
      document.title = 'ほんのしおり β';
      document.documentElement.classList.add('beta');
    }
  </script>
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="beta-bar">β 試験版 ― 本番とはデータが別です</div>
  <div class="progress-bar" id="progressBar" hidden></div>
  <main id="app"></main>

  <nav class="tabbar" id="tabbar">
    <a href="#/" data-tab="shelf"><span class="ti">📚</span><span>本棚</span></a>
    <a href="#/tags" data-tab="tags"><span class="ti">🏷️</span><span>タグ</span></a>
    <a href="#/settings" data-tab="settings"><span class="ti">⚙️</span><span>設定</span></a>
  </nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
