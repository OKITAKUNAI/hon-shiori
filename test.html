<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>しおり テスト</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 16px; max-width: 760px; margin: 0 auto; }
    h1 { font-size: 1.3rem; }
    #results { list-style: none; padding: 0; font-size: 0.9rem; }
    #results li { padding: 6px 10px; border-radius: 10px; margin: 4px 0; background: #fff; }
    #results li.pass::before { content: '✅ '; }
    #results li.fail { background: #fde8e8; }
    #results li.fail::before { content: '❌ '; }
    #results small { display: block; color: var(--sub); white-space: pre-wrap; }
    #summary { font-weight: 700; }
    table.psm { width: 100%; border-collapse: collapse; font-size: 0.85rem; background: #fff; }
    table.psm th, table.psm td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    table.psm td.vt { writing-mode: vertical-rl; max-height: 16em; line-height: 1.8; }
  </style>
</head>
<body>
  <h1>ほんのしおり 自動テスト</h1>
  <p class="muted small">テスト専用のデータベース（hon-shiori-test）だけを使います。本番・試験版のデータには触れません。見本の画像はすべて canvas で描いたものです。</p>
  <p id="summary">実行中…</p>
  <ul id="results"></ul>

  <h2 class="sec">縦書きの読み方の比較（PSM 5 と PSM 3）</h2>
  <table class="psm"><thead><tr><th></th><th>一致率</th><th>時間</th><th>読み取った文章</th></tr></thead><tbody id="psmCompare"><tr><td colspan="4">テスト後に表示します</td></tr></tbody></table>

  <h2 class="sec">カードの見た目（D案の見本）</h2>
  <div class="pages" id="preview"></div>

  <script type="module" src="tests.js"></script>
</body>
</html>
